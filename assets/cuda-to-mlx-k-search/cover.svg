<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CUDA kernel-to-MLX optimization translation map</title>
  <desc id="desc">CUDA optimization concepts mapped to native MLX implementations on Apple Silicon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050817"/><stop offset="1" stop-color="#101429"/></linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#10252a"/><stop offset="1" stop-color="#0d1b24"/></linearGradient>
    <linearGradient id="target" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#222038"/><stop offset="1" stop-color="#171629"/></linearGradient>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#72c98d"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#6f9fe1"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#aa75db"/></marker>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#70c8d1"/></marker>
    <style>
      text{font-family:Inter,"Helvetica Neue",Arial,sans-serif}
      .overline{fill:#f0f2f6;font-size:16px;font-weight:700;letter-spacing:.5px;text-anchor:middle}
      .subtitle{fill:#d7dbe4;font-size:16px;font-weight:400;text-anchor:middle}
      .label{fill:#f5f7fb;font-size:15px;font-weight:500;letter-spacing:.2px;text-anchor:middle}
      .note{fill:#e4e7ee;font-size:12px;text-anchor:middle}
      .footer{fill:#f2f4f8;font-size:16px;font-weight:600;letter-spacing:3px;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="none" stroke="#7583a5" stroke-width="1" opacity=".1"><path d="M0 112H300M900 112H1200M0 520H240V492M960 492V520H1200"/></g>

  <text x="258" y="65" class="overline">NVIDIA GPU SOURCE:</text>
  <text x="258" y="89" class="subtitle">Kernel Algorithms in CUDA</text>
  <text x="940" y="65" class="overline">APPLE SILICON TARGET:</text>
  <text x="940" y="89" class="subtitle">Native MLX Implementations</text>

  <g aria-label="CUDA concepts">
    <rect x="78" y="150" width="360" height="330" rx="20" fill="url(#source)" stroke="#668978" stroke-width="2"/>
    <g stroke="#668978" stroke-width="2"><path d="M120 150V132M178 150V132M236 150V132M294 150V132M352 150V132M396 150V132"/><path d="M120 480V498M178 480V498M236 480V498M294 480V498M352 480V498M396 480V498"/></g>
    <rect x="108" y="184" width="140" height="108" rx="14" fill="#17382d" stroke="#71d59a" stroke-width="2"/>
    <text x="178" y="226" class="label">SHARED</text><text x="178" y="247" class="label">MEM</text>
    <rect x="268" y="184" width="140" height="108" rx="14" fill="#182d4d" stroke="#78aef8" stroke-width="2"/>
    <text x="338" y="226" class="label">WARP</text><text x="338" y="247" class="label">PRIMITIVES</text>
    <rect x="108" y="316" width="140" height="108" rx="14" fill="#32234a" stroke="#bc8cf5" stroke-width="2"/>
    <text x="178" y="358" class="label">MEM</text><text x="178" y="379" class="label">TRANSPOSE</text>
    <rect x="268" y="316" width="140" height="108" rx="14" fill="#163a40" stroke="#72d6df" stroke-width="2"/>
    <text x="338" y="358" class="label">SHUFFLE</text><text x="338" y="379" class="label">OPERATIONS</text>
  </g>

  <g aria-label="MLX concepts">
    <rect x="760" y="150" width="360" height="330" rx="20" fill="url(#target)" stroke="#706b81" stroke-width="2"/>
    <g stroke="#706b81" stroke-width="2"><path d="M802 150V132M860 150V132M918 150V132M976 150V132M1034 150V132M1078 150V132"/><path d="M802 480V498M860 480V498M918 480V498M976 480V498M1034 480V498M1078 480V498"/></g>
    <rect x="790" y="184" width="140" height="108" rx="14" fill="#17382d" stroke="#71d59a" stroke-width="2"/>
    <text x="860" y="244" class="label" font-size="13">THREADGROUP</text>
    <rect x="950" y="184" width="140" height="108" rx="14" fill="#182d4d" stroke="#78aef8" stroke-width="2"/>
    <text x="1020" y="226" class="label">MMA</text><text x="1020" y="247" class="label">BLOCKS</text>
    <rect x="790" y="316" width="140" height="108" rx="14" fill="#32234a" stroke="#bc8cf5" stroke-width="2"/>
    <text x="860" y="358" class="label">UNIFIED</text><text x="860" y="379" class="label">MEMORY</text>
    <rect x="950" y="316" width="140" height="108" rx="14" fill="#163a40" stroke="#72d6df" stroke-width="2"/>
    <text x="1020" y="358" class="label">SIMD</text><text x="1020" y="379" class="label">REDUCE</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M438 218C555 190 650 192 750 216" stroke="#72c98d"/>
    <path d="M438 258C560 252 640 252 750 258" stroke="#6f9fe1"/>
    <path d="M438 350C560 374 640 374 750 352" stroke="#aa75db"/>
    <path d="M438 390C555 420 650 418 750 392" stroke="#70c8d1"/>
    <path d="M748 209L760 218L746 223Z" fill="#72c98d" stroke="none"/>
    <path d="M748 250L760 258L748 266Z" fill="#6f9fe1" stroke="none"/>
    <path d="M746 345L760 350L748 359Z" fill="#aa75db" stroke="none"/>
    <path d="M746 385L760 390L748 399Z" fill="#70c8d1" stroke="none"/>
  </g>

  <rect x="470" y="414" width="260" height="68" rx="8" fill="#090e1e" opacity=".96"/>
  <text x="600" y="437" class="note">Optimizing data structures and mapping</text>
  <text x="600" y="453" class="note">parallel primitives for a new hardware</text>
  <text x="600" y="469" class="note">architecture</text>
  <line x1="78" y1="516" x2="1120" y2="516" stroke="#fff" opacity=".11"/>
  <text x="600" y="575" class="footer">CUDA KERNEL-TO-MLX OPTIMIZATION TRANSLATION MAP</text>
</svg>
